<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Styles</title>
<style>
  :root {
    --bg: #fafaf9;
    --fg: #1c1917;
    --accent: #2563eb;
    --accent-light: #dbeafe;
    --muted: #78716c;
    --border: #e7e5e4;
    --code-bg: #f5f5f4;
    --success: #16a34a;
    --warning: #d97706;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    --serif: 'Georgia', 'Times New Roman', serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --fg: #e7e5e4;
      --accent: #60a5fa;
      --accent-light: #1e3a5f;
      --muted: #a8a29e;
      --border: #44403c;
      --code-bg: #292524;
      --success: #4ade80;
      --warning: #fbbf24;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 6rem;
  }

  h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
  h2 { font-size: 1.4rem; font-weight: 600; margin-top: 2.5rem; margin-bottom: 0.75rem; letter-spacing: -0.01em; }
  h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; }

  p { margin-bottom: 1rem; }

  .subtitle {
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 2rem;
    font-family: var(--serif);
    font-style: italic;
  }

  .lesson-number {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    margin-bottom: 0.5rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 0.15em 0.35em;
    border-radius: 4px;
  }

  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    overflow-x: auto;
    margin-bottom: 1.25rem;
    font-size: 0.85rem;
    line-height: 1.5;
  }

  pre code { background: none; padding: 0; }

  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-light);
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
    border-radius: 0 6px 6px 0;
    font-size: 0.95rem;
  }

  .callout strong { color: var(--accent); }

  .callout.warning {
    border-left-color: var(--warning);
    background: #fef3c7;
  }

  @media (prefers-color-scheme: dark) {
    .callout.warning { background: #422006; }
  }

  ul, ol { margin-bottom: 1rem; padding-left: 1.5rem; }
  li { margin-bottom: 0.35rem; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .diagram {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
    font-family: var(--mono);
    font-size: 0.82rem;
    line-height: 1.4;
    overflow-x: auto;
    white-space: pre;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 1.25rem;
    font-size: 0.92rem;
  }

  th, td {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  th { font-weight: 600; }

  .nav-links {
    display: flex;
    justify-content: space-between;
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
  }

  .footer-note {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }

  .tag {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.1em 0.5em;
    border-radius: 3px;
    margin-right: 0.25rem;
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  .two-col > div {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem 1rem;
  }

  .two-col > div strong { display: block; margin-bottom: 0.35rem; }

  @media print {
    body { max-width: none; padding: 1in; }
    .callout { break-inside: avoid; }
    pre { break-inside: avoid; }
  }
</style>
</head>
</html>
